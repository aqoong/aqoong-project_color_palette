builders:
  palette_generator:
    import: "package:project_color_palette/generator/palette_generator.dart"
    builder_factories: ["paletteGeneratorBuilder"]
    build_extensions: {"assets/color_palette/{{}}.csv": ["lib/palette/{{}}.g.dart"]}
    auto_apply: dependents
    build_to: source
    applies_builders: []
    defaults:
      # Applies to every package that depends on project_color_palette; a
      # consumer can still narrow or widen this in its own build.yaml.
      generate_for:
        - assets/color_palette/*.csv
      options:
        # Member names follow the alias' own words: `text/primary` becomes
        # `textPrimary`. Set to true for the pre-2.0.0 `colorTextprimary` style.
        color_prefix: false
        # `trailing` reads 8 digit values as #RRGGBBAA (Figma / CSS order),
        # `leading` reads them as #AARRGGBB (Flutter's Color(0x...) order).
        hex_alpha_position: trailing
        # Emit `byAlias`, a Map<String, Color> keyed by the raw CSV alias.
        generate_alias_map: true
